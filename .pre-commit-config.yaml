# Setup: mise install && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      # System hooks call binaries from mise.toml / homebrew — no toolchain builds.
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
        exclude: '\.tmpl$' # Go template syntax isn't valid shell
      - id: shellcheck-modify-scripts
        name: shellcheck (chezmoi modify_ scripts)
        entry: shellcheck --shell=bash
        language: system
        files: '(^|/)modify_[^/]+$'
      - id: gitleaks
        name: gitleaks (staged secrets scan)
        entry: gitleaks git --pre-commit --redact --staged --verbose
        language: system
        pass_filenames: false

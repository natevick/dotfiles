#!/usr/bin/env bash
# chezmoi modify_ script for ~/.codex/config.toml.
#
# Owns ONLY the top-level model keys printed below; everything else — [projects]
# trust levels, [notice] migrations, plugin state, all codex-written — is left
# exactly as the machine/app left it. Change these keys in the dotfiles, not in
# codex: an app-side change to an owned key is reverted on the next apply.
# Auth lives in ~/.codex/auth.json, never here.

awk '
  BEGIN {
    print "model = \"gpt-5.6-sol\""
    print "model_reasoning_effort = \"xhigh\""
  }
  /^\[/ { in_section = 1 }
  !in_section && /^model[[:space:]]*=/ { next }
  !in_section && /^model_reasoning_effort[[:space:]]*=/ { next }
  { print }
'
